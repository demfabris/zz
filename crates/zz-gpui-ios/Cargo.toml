[package]
name = "zz-gpui-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
type_complexity = "allow"

[target.'cfg(target_os = "ios")'.dependencies]
accesskit_ios = "0.1.2"
anyhow = "1"
async-task = "4.7"
base64 = "0.23.1"
block2 = "0.6.2"
chrono = "0.4.45"
image = { version = "=0.25.10", default-features = false }
dispatch2 = "0.3.1"
env_logger.workspace = true
futures = "0.3"
gpui.workspace = true
gpui_wgpu = { git = "https://github.com/demfabris/zed", rev = "9b46226e6f89d093c3e36d1afbdcbdc47ee88cb6" }
log.workspace = true
memmap2 = "0.9.11"
objc = "0.2"
parking_lot.workspace = true
percent-encoding = "2.3.2"
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = "1"
zz-client = { path = "../zz-client" }
zz-daemon = { path = "../zz-daemon", default-features = false }
zz-protocol = { path = "../zz-protocol" }
zz-terminal = { path = "../zz-terminal", default-features = false }
zz-ui = { path = "../zz-ui", features = ["agent", "tree-sitter"] }

[dev-dependencies]
async-channel = "2.5.0"
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
zz-client = { path = "../zz-client" }
zz-daemon = { path = "../zz-daemon", default-features = false }
zz-protocol = { path = "../zz-protocol" }
env_logger.workspace = true
zz-terminal = { path = "../zz-terminal", default-features = false }
zz-ui = { path = "../zz-ui", features = ["agent"] }
