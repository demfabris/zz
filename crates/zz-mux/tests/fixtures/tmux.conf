# A representative existing tmux config: zz applies the subset it knows and
# deliberately ignores unrelated shell and plugin commands.
set -g prefix C-a
set -g history-limit 1234
set -g word-separators ""
set -gw mode-keys vi
set -g status off
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "#(battery) "
set -ga status-right "%H:%M"
bind -n F2 split-window -h
bind c new-window -n scratch
bind R command-prompt -I '#S' "rename-session -- '%%'"
bind W command-prompt -I '#W' "rename-window -- '%%'"
unbind '"'
if-shell 'test -d ~/.tmux/plugins/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
