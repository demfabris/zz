[package]
name = "zz"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The zz desktop client: GPUI shell, terminal/browser/agent panes, settings, daemon client"
publish = false
default-run = "zz"

[features]
default = ["desktop", "agent-pane"]
desktop = []
agent-pane = ["dep:agent-client-protocol", "dep:fff-search", "dep:ignore", "zz-ui/agent"]
editor-pane = ["dep:fff-search", "dep:ignore", "zz-ui/editor"]
hotreload = ["dep:dioxus-devtools"]

[[bin]]
name = "zz"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "zz_helper"
path = "src/bin/zz_helper.rs"
required-features = ["desktop"]

[[bin]]
name = "zz_browser_fixture"
path = "src/bin/zz_browser_fixture.rs"
required-features = ["desktop"]

[[bin]]
name = "zz_external_texture_fixture"
path = "src/bin/zz_external_texture_fixture.rs"
required-features = ["desktop"]

[dependencies]
zz-cli.workspace = true
zz-config = { workspace = true, features = ["update"] }
agent-client-protocol = { workspace = true, optional = true }
async-channel.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["default"] }
dioxus-devtools = { version = "=0.7.10", default-features = false, optional = true }
env_logger.workspace = true
zpui = { workspace = true, features = ["default"] }
fff-search = { version = "=0.10.6", optional = true }
ignore = { workspace = true, optional = true }
image = { workspace = true, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
log.workspace = true
naga.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
zz-client.workspace = true
zz-mux.workspace = true
zz-protocol.workspace = true
zz-ui = { workspace = true, features = ["editor", "tree-sitter"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
zpui-platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
mimalloc.workspace = true
semver = "1"
wgpu.workspace = true
zz-browser.workspace = true
zz-chrome-import.workspace = true
zz-daemon = { workspace = true, features = ["default"] }
zz-daemon-client.workspace = true
zz-terminal = { workspace = true, features = ["default"] }
zz-tui.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cef.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-video.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSButton", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-foundation = { workspace = true, features = ["NSBundle", "NSData", "NSPathUtilities", "NSString"] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CATransaction", "objc2-core-foundation"] }
raw-window-handle.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc.workspace = true
mimalloc = { workspace = true, features = ["no_thp"] }
raw-window-handle.workspace = true
wayland-client.workspace = true
x11rb.workspace = true

[dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# The X11/Wayland backend also compiles into unix test builds so it
# type-checks from a mac; wayland-sys cannot compile on Windows at all, which
# is what an ungated dev-dependency used to break there.
[target.'cfg(all(unix, not(target_os = "ios")))'.dev-dependencies]
wayland-client.workspace = true
x11rb.workspace = true

[package.metadata.cef.bundle]
helper_name = "zz_helper"

[lints]
workspace = true
