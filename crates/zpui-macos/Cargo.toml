[package]
name = "zpui-macos"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
style = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/zpui_macos.rs"
doctest = false

[features]
default = ["zpui/default"]
bench-support = ["zpui/bench-support", "zpui-apple/bench-support"]
test-support = ["zpui/test-support", "zpui-apple/test-support"]
runtime_shaders = ["zpui-apple/runtime_shaders"]
font-kit = ["dep:font-kit"]

[dependencies]
zpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_macos.workspace = true
anyhow.workspace = true
async-task.workspace = true
block2.workspace = true
cocoa.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text.workspace = true
ctor.workspace = true
dispatch2 = "0.3.1"
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types.workspace = true
futures.workspace = true
zpui-apple.workspace = true
zpui-util.workspace = true
image = { workspace = true, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
itertools.workspace = true
libc.workspace = true
log = { workspace = true, features = ["kv_unstable_serde", "serde"] }
mach2.workspace = true
objc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSAlert",
    "NSButton",
    "NSControl",
    "NSDraggingItem",
    "NSGraphics",
    "NSImage",
    "NSPasteboard",
    "NSScreen",
    "NSTrackingArea",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSUndoManager",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-user-notifications.workspace = true
parking_lot.workspace = true
pathfinder_geometry.workspace = true
raw-window-handle.workspace = true
semver.workspace = true
smallvec = { workspace = true, features = ["union", "const_new"] }
strum.workspace = true
uuid.workspace = true

# The macOS test-only window implementation depends on test-only APIs from both
# GPUI and the extracted renderer. A dependency does not inherit this crate's
# `cfg(test)`, so dev-dependencies enable those APIs only for test builds.
[target.'cfg(target_os = "macos")'.dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }
zpui-apple = { workspace = true, features = ["test-support"] }
