<!doctype html>
<html lang="en" data-zz-gpui-a11y>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>zz storybook</title>
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="main.js"></script>
    </head>
    <body>
        <nav id="nav" aria-label="Stories"></nav>
        <main id="story" aria-live="polite">
            <p class="loading">Starting zz…</p>
        </main>
        <aside id="knobs" aria-label="Knobs">
            <h2>Knobs</h2>
            <form id="knob-form">
                <label>
                    <span>Theme</span>
                    <select name="theme">
                        <option value="system">System</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </label>
                <label>
                    <span>Palette</span>
                    <select name="preset">
                        <option value="default">zz default</option>
                    </select>
                </label>
                <label>
                    <span>Contrast <output name="contrast-value"></output></span>
                    <input type="range" name="contrast" min="0.5" max="2" step="0.05" value="1" />
                </label>
                <label>
                    <span>Zoom <output name="zoom-value"></output></span>
                    <input type="range" name="zoom" min="0.75" max="1.5" step="0.05" value="1" />
                </label>
                <label>
                    <span>Pane opacity <output name="pane-opacity-value"></output></span>
                    <input type="range" name="pane-opacity" min="0" max="1" step="0.05" value="0.5" />
                </label>
                <label>
                    <span>Pane glow <output name="pane-glow-value"></output></span>
                    <input type="range" name="pane-glow" min="0" max="2" step="0.1" value="1" />
                </label>
                <label>
                    <span>Backdrop under floating surfaces</span>
                    <select name="backdrop">
                        <option value="plain">Plain</option>
                        <option value="code">Terminal output</option>
                        <option value="color">Color and stripes</option>
                    </select>
                </label>
                <label class="check">
                    <input type="checkbox" name="motion" checked />
                    <span>Animations</span>
                </label>

                <h3>Style</h3>
                <label>
                    <span>Start from</span>
                    <select name="style">
                        <option value="flat">Flat</option>
                        <option value="modern" selected>Modern</option>
                        <option value="full">Full</option>
                    </select>
                </label>
                <label>
                    <span>Corner radius <output name="radius-value"></output></span>
                    <input type="range" name="radius" min="0" max="25" step="1" value="24" />
                </label>
                <label>
                    <span>Corner smoothing <output name="smoothing-value"></output></span>
                    <input type="range" name="smoothing" min="2" max="6" step="0.5" value="4" />
                </label>
                <label>
                    <span>Row inset <output name="row-inset-value"></output></span>
                    <input type="range" name="row-inset" min="0" max="12" step="1" value="4" />
                </label>
                <label>
                    <span>Selection</span>
                    <select name="selection">
                        <option value="accent">Accent</option>
                        <option value="wash">Neutral wash</option>
                    </select>
                </label>
                <label>
                    <span>Outline <output name="outline-value"></output></span>
                    <input type="range" name="outline" min="0" max="3" step="0.05" value="1" />
                </label>
                <label>
                    <span>Outline width <output name="outline-width-value"></output></span>
                    <input type="range" name="outline-width" min="0" max="3" step="0.25" value="0.5" />
                </label>
                <label>
                    <span>Shadow <output name="shadow-value"></output></span>
                    <input type="range" name="shadow" min="0" max="1" step="0.05" value="1" />
                </label>
                <label>
                    <span>Elevation <output name="elevation-value"></output></span>
                    <input type="range" name="elevation" min="0" max="3" step="0.1" value="1" />
                </label>
                <label>
                    <span>Glass</span>
                    <select name="glass">
                        <option value="style">The style's</option>
                        <option value="off">Off</option>
                        <option value="regular">Regular</option>
                        <option value="clear">Clear</option>
                        <option value="frosted">Frosted</option>
                        <option value="smoked">Smoked</option>
                        <option value="bubble">Bubble</option>
                    </select>
                </label>
                <fieldset id="glass-knobs" hidden>
                    <label>
                        <span>Blur <output name="glass-blur-value"></output></span>
                        <input type="range" name="glass-blur" min="0" max="40" step="0.05" />
                    </label>
                    <label>
                        <span>Surface tint <output name="glass-tint-value"></output></span>
                        <input type="range" name="glass-tint" min="0" max="1" step="0.01" />
                    </label>
                    <label>
                        <span>Refraction <output name="glass-refraction-value"></output></span>
                        <input type="range" name="glass-refraction" min="-60" max="150" step="1" />
                    </label>
                    <label>
                        <span>Bezel <output name="glass-bezel-value"></output></span>
                        <input type="range" name="glass-bezel" min="0" max="60" step="1" />
                    </label>
                    <label>
                        <span>Dispersion <output name="glass-dispersion-value"></output></span>
                        <input type="range" name="glass-dispersion" min="0" max="0.6" step="0.01" />
                    </label>
                    <label>
                        <span>Saturation <output name="glass-saturation-value"></output></span>
                        <input type="range" name="glass-saturation" min="0.5" max="2.5" step="0.05" />
                    </label>
                    <label>
                        <span>Brightness <output name="glass-brightness-value"></output></span>
                        <input type="range" name="glass-brightness" min="-0.3" max="0.3" step="0.01" />
                    </label>
                    <label>
                        <span>Contrast <output name="glass-contrast-value"></output></span>
                        <input type="range" name="glass-contrast" min="0.5" max="2" step="0.05" />
                    </label>
                    <label>
                        <span>Glint <output name="glass-specular-value"></output></span>
                        <input type="range" name="glass-specular" min="0" max="1.5" step="0.05" />
                    </label>
                    <label>
                        <span>Glint width <output name="glass-glint-width-value"></output></span>
                        <input type="range" name="glass-glint-width" min="0" max="6" step="0.1" />
                    </label>
                    <label>
                        <span>Light angle <output name="glass-light-value"></output></span>
                        <input type="range" name="glass-light" min="-180" max="180" step="5" />
                    </label>
                    <label>
                        <span>Rim glow <output name="glass-fresnel-value"></output></span>
                        <input type="range" name="glass-fresnel" min="0" max="0.5" step="0.01" />
                    </label>
                    <label>
                        <span>Edge shadow <output name="glass-edge-value"></output></span>
                        <input type="range" name="glass-edge" min="0" max="1" step="0.05" />
                    </label>
                    <label>
                        <span>Edge shadow width <output name="glass-edge-width-value"></output></span>
                        <input type="range" name="glass-edge-width" min="0" max="4" step="0.05" />
                    </label>
                    <label>
                        <span>Grain <output name="glass-noise-value"></output></span>
                        <input type="range" name="glass-noise" min="0" max="0.1" step="0.005" />
                    </label>
                </fieldset>
                <div class="export">
                    <button type="button" id="export-look">Copy look as JSON</button>
                    <textarea id="look-json" readonly rows="12" hidden aria-label="Look as JSON"></textarea>
                </div>
                <button type="reset">Reset</button>
            </form>
            <p class="hint">
                Agents: <code>storybook.show(id)</code>, <code>storybook.setKnobs({ theme: "dark" })</code>,
                and <code>zzGpui.find</code> / <code>zzGpui.click</code> / <code>zzGpui.capture</code> for the live UI.
            </p>
        </aside>
    </body>
</html>
