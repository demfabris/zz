# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# Core behavior
set -g base-index 1
set -s escape-time 0
set -g detach-on-destroy off
set -g renumber-windows on
set -g mouse on
set -g bell-action any
set -g history-limit 10000
set -g extended-keys on
set -g focus-events on
set -g status-keys emacs

# Terminal features
set -g default-terminal "tmux-256color"
set -s terminal-overrides[1] '*256col*:Tc'
set -s terminal-overrides[2] '*:Smulx=\E[4::%p1%dm'
set -s terminal-overrides[3] '*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# Fixed array slots keep reloads idempotent; set -as/set -ag would append duplicates.
set -s terminal-features[3] 'foot*:RGB:sync:clipboard:hyperlinks:extkeys'
set -s terminal-features[4] 'xterm-256color:RGB:sync:clipboard:hyperlinks:extkeys'
set -s set-clipboard on
set -g allow-passthrough on

# Window titles
set -g set-titles on
set -g set-titles-string '#W · #{b:pane_current_path}'

# Theme: macOS Classic (Zed theme by huacnlee)
# Uses macOS Appearance on startup/reload; prefix T reapplies after changes.
set -g status on
set -g status-position bottom
run-shell "~/.tmux/bin/apply-theme --quiet"

# Keep the native command prompt, but make the underlying status line empty.
# set -g status-style 'bg=default,fg=default'
# set -g status-left ''
# set -g status-right ''
# set -g status-format[0] ''
# set -g window-status-format ''
# set -g window-status-current-format ''
# set -g window-status-style 'bg=default,fg=default'
# set -g window-status-current-style 'bg=default,fg=default'
# set -g message-style 'bg=default,fg=default'
# set -g message-command-style 'bg=default,fg=default'
# set -g message-format '#{message}'

# Pane workflow
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h resize-pane -L 1
bind -n M-j resize-pane -D 1
bind -n M-k resize-pane -U 1
bind -n M-l resize-pane -R 1
bind-key x kill-pane

# Window workflow
bind c new-window -c "#{pane_current_path}"
bind C-c new-window -c "#{pane_current_path}"
bind C-n next-window
bind C-p previous-window
bind -n C-M-h previous-window
bind -n C-M-l next-window
bind C-d detach-client

# Session navigator
bind -n M-Tab choose-tree -Zs
unbind Tab

# Command prompt
bind : command-prompt

# To toggle statusbar
bind b set -g status \; display-message "status: #{?status,on,off}"
bind T run-shell "~/.tmux/bin/apply-theme"

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-o send-keys -X copy-pipe-and-cancel 'xargs -I {} tmux new-window "nvim -- {}"'
bind -T copy-mode-vi WheelUpPane select-pane\; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane\; send-keys -X -N 1 scroll-down

# Config
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# Path picker (only pin the homebrew path where it exists; elsewhere the
# plugin falls back to `fpp` from PATH)
unbind u
if-shell 'test -x /opt/homebrew/bin/fpp' 'set -g @fpp-path /opt/homebrew/bin/fpp'
run-shell "~/.tmux/plugins/tmux-fpp/fpp.tmux"
