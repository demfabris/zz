[package]
name = "zpui-apple"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
style = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/zpui_apple.rs"
doctest = false

[features]
default = []
bench-support = ["zpui/bench-support"]
test-support = ["zpui/test-support"]
runtime_shaders = []

[dependencies]
zpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
block2.workspace = true
cocoa.workspace = true
core-foundation.workspace = true
core-video = { workspace = true, features = ["metal"] }
derive_more.workspace = true
etagere.workspace = true
foreign-types.workspace = true
image = { workspace = true, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
log = { workspace = true, features = ["kv_unstable_serde", "serde"] }
metal.workspace = true
naga = { version = "30.0.1", features = ["wgsl-in", "msl-out"] }
objc.workspace = true
objc2.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }
