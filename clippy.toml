# Vendor names that read as prose, not as code: `doc_markdown` flags their
# internal capitals and backticking a company name is worse than the lint.
# `..` keeps clippy's own default list.
doc-valid-idents = ["OpenAI", "AppKit", "KWin", ".."]

disallowed-methods = [
    { path = "zpui::rgb", reason = "chrome colors must come from cx.theme(); see knowledge/configuration/ui-conventions doc" },
    { path = "zpui::rgba", reason = "chrome colors must come from cx.theme(); see knowledge/configuration/ui-conventions doc" },
    { path = "zpui::hsla", reason = "chrome colors must come from cx.theme(); see knowledge/configuration/ui-conventions doc" },
    { path = "std::process::Command::spawn", reason = "children inherit the signal mask of the spawning thread; spawn through zz_daemon::unmasked::SpawnUnmasked" },
    { path = "std::process::Command::output", reason = "children inherit the signal mask of the spawning thread; spawn through zz_daemon::unmasked::SpawnUnmasked" },
    { path = "std::process::Command::status", reason = "children inherit the signal mask of the spawning thread; spawn through zz_daemon::unmasked::SpawnUnmasked" },
]
