[package]
name = "zpui_apple"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/zpui_apple.rs"
doctest = false

[features]
default = []
bench-support = ["zpui/bench-support"]
test-support = ["zpui/test-support"]
runtime_shaders = []

[dependencies]
zpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
block2.workspace = true
cocoa.workspace = true
core-foundation.workspace = true
core-video.workspace = true
derive_more.workspace = true
etagere.workspace = true
foreign-types.workspace = true
image.workspace = true
log.workspace = true
metal.workspace = true
naga = { version = "30.0.1", features = ["wgsl-in", "msl-out"] }
objc.workspace = true
objc2.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }
