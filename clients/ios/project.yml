name: ZZMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ZZ_DEV_BUILD: "0"
    ZZ_APP_BUNDLE_ID: dev.zz.ios
    ZZ_APP_DISPLAY_NAME: zz
    ZZ_APP_URL_SCHEME: zz
    ZZ_APP_ICON: zz
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.8.0
targets:
  ZZMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Support/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: $(ZZ_APP_BUNDLE_ID)
            CFBundleURLSchemes:
              - $(ZZ_APP_URL_SCHEME)
        CFBundleDisplayName: $(ZZ_APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSLocalNetworkUsageDescription: zz connects to your computer on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - FiraCode-Regular.ttf
          - FiraCode-Bold.ttf
          - GeistMono-Regular.otf
          - GeistMono-Bold.otf
          - 0xProto-Regular.ttf
          - 0xProto-Bold.ttf
          - 0xProto-Italic.ttf
        UILaunchScreen: {}
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    sources:
      - Sources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/themes
        type: folder
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: ../../assets/zz.icon
        buildPhase: resources
      - path: ../../assets/zz-dev.icon
        buildPhase: resources
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: $(ZZ_APP_ICON)
        PRODUCT_BUNDLE_IDENTIFIER: $(ZZ_APP_BUNDLE_ID)
        PRODUCT_NAME: ZZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y4JYPG9TS8
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Support/ZZ-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../../crates/zz-client-ffi/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS: $(inherited) -lzz_client_ffi -framework CoreFoundation -framework Security -framework SystemConfiguration -lresolv
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust client core
        script: |
          set -euo pipefail
          "$SRCROOT/../../scripts/build-ios-client-core.sh"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libzz_client_ffi.a
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - ZZMobileTests
        - ZZMobileUITests
  ZZMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/Unit
    dependencies:
      - target: ZZMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZZ_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ZZ.app/ZZ
        BUNDLE_LOADER: $(TEST_HOST)
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../../crates/zz-client-ffi/include

  ZZMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/UI
    dependencies:
      - target: ZZMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZZ_APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ZZMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
