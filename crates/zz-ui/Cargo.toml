[package]
name = "zz-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zz's application UI on zpui-kit: panes, terminal, agent, palette, settings, navigation"
publish = false

[features]
default = []
agent = ["dep:merman"]
editor = ["zpui-kit/editor"]
tree-sitter = ["zpui-kit/tree-sitter"]

[dependencies]
image.workspace = true
log.workspace = true
markdown = { version = "1.0", features = ["serde"] }
merman = { workspace = true, optional = true }
parking_lot.workspace = true
serde_json.workspace = true
smallvec.workspace = true
web-time.workspace = true
zpui = { workspace = true, features = ["default"] }
zz-client.workspace = true
zpui-kit.workspace = true
zz-protocol.workspace = true
zz-terminal.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
url.workspace = true

[dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
