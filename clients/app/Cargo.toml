[package]
name = "zz-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The thin-client app the web and iOS clients share"
publish = false

[dependencies]
async-channel.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["default"] }
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
zpui = { workspace = true, features = ["default"] }
zz-client.workspace = true
zz-protocol.workspace = true
zz-terminal.workspace = true
zz-ui = { workspace = true, features = ["agent"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "Blob", "Clipboard", "CloseEvent", "Document", "Element", "ErrorEvent", "Event", "File", "FileList", "HtmlElement", "HtmlInputElement", "Location", "MessageEvent", "Navigator", "Node", "Storage", "WebSocket", "Window"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
futures.workspace = true
objc = "0.2"
percent-encoding = "2.3.2"
raw-window-handle.workspace = true
zpui-platform.workspace = true
zz-daemon-client.workspace = true

[dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }
zpui-platform.workspace = true

[lints]
workspace = true
