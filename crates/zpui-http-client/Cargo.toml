[package]
name = "zpui-http-client"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A HTTP client library for Zed and GPUI"

[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
style = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[features]
test-support = []

[lib]
name = "http_client"
path = "src/http_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
bytes.workspace = true
derive_more.workspace = true
futures.workspace = true
http-body.workspace = true
http.workspace = true
log = { workspace = true, features = ["kv_unstable_serde", "serde"] }
parking_lot.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
serde_urlencoded.workspace = true
url.workspace = true
