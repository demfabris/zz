[package]
name = "zz-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zz for iPhone and iPad: the entry point around zz-app and zpui_ios"
publish = false

[target.'cfg(target_os = "ios")'.dependencies]
env_logger.workspace = true
futures = "0.3"
zpui.workspace = true
zpui_ios = { path = "../../zpui/crates/zpui_ios" }
zz-app = { path = "../app" }
zz-ui = { path = "../../crates/zz-ui", features = ["agent", "tree-sitter"] }

[target.'cfg(target_os = "ios")'.dev-dependencies]
image.workspace = true
zz-client = { path = "../../crates/zz-client" }
zz-daemon = { path = "../../crates/zz-daemon", default-features = false }
zz-protocol = { path = "../../crates/zz-protocol" }
zz-terminal = { path = "../../crates/zz-terminal", default-features = false }

[lints]
workspace = true
