[package]
name = "zz-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The thin-client app the web and iOS clients share"
publish = false

[dependencies]
async-channel.workspace = true
base64.workspace = true
chrono = "0.4.45"
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
zpui.workspace = true
zz-client = { path = "../../crates/zz-client" }
zz-protocol = { path = "../../crates/zz-protocol" }
zz-terminal = { path = "../../crates/zz-terminal", default-features = false }
zz-ui = { path = "../../crates/zz-ui", features = ["agent"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "Blob", "Clipboard", "CloseEvent", "Document", "Element", "ErrorEvent", "Event", "File", "FileList", "HtmlElement", "HtmlInputElement", "Location", "MessageEvent", "Navigator", "Node", "Storage", "WebSocket", "Window"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
futures = "0.3"
objc = "0.2"
percent-encoding = "2.3.2"
raw-window-handle.workspace = true
zpui_ios = { path = "../../zpui/crates/zpui_ios" }
zz-daemon = { path = "../../crates/zz-daemon", default-features = false }

[dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }
zpui_ios = { path = "../../zpui/crates/zpui_ios" }

[lints]
workspace = true
