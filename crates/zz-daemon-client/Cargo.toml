[package]
name = "zz-daemon-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client half of the zz daemon: endpoints, ssh tunnels, and the command and interactive clients"
publish = false

[dependencies]
getrandom.workspace = true
interprocess.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zeroize.workspace = true
zz-protocol.workspace = true
zz-terminal.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
getrandom = { workspace = true, features = ["sys_rng"] }
core-foundation.workspace = true
security-framework-sys = "2.17"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "net"] }

[target.'cfg(windows)'.dependencies]
sysinfo.workspace = true

[dev-dependencies]
sysinfo.workspace = true
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros", "test-util"] }

[lints]
workspace = true
