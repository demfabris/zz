derive_refineable = { path = "crates/refineable/derive_refineable" }
zpui = { path = "crates/zpui", default-features = false }
zpui_apple = { path = "crates/zpui_apple" }
zpui_linux = { path = "crates/zpui_linux", default-features = false }
zpui_macos = { path = "crates/zpui_macos", default-features = false }
zpui_macros = { path = "crates/zpui_macros" }
zpui_platform = { path = "crates/zpui_platform", default-features = false }
zpui_shared_string = { path = "crates/zpui_shared_string" }
zpui_util = { path = "crates/zpui_util" }
zpui_web = { path = "crates/zpui_web" }
zpui_ios = { path = "crates/zpui_ios" }
zpui_wgpu = { path = "crates/zpui_wgpu" }
zpui_windows = { path = "crates/zpui_windows", default-features = false }
http_client = { path = "crates/http_client" }
perf = { path = "tooling/perf" }
refineable = { path = "crates/refineable" }
scheduler = { path = "crates/scheduler" }
sum_tree = { path = "crates/sum_tree" }
util_macros = { path = "crates/util_macros" }
zlog = { path = "crates/zlog" }
ztracing = { path = "crates/ztracing" }
ztracing_macro = { path = "crates/ztracing_macro" }

