[package]
name = "zz-gpui-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# No [lints] workspace inheritance: most of src/ is code copied from
# gpui_macos; keeping it diff-minimal beats keeping it lint-clean. The copied
# code checks gpui feature flags this crate never declares - teach check-cfg
# about them instead of editing every cfg site.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy", "test-support"))',
] }

[features]
default = ["font-kit", "runtime_shaders"]
# Compile the Metal shaders from source on-device instead of shipping a
# metallib; avoids cross-compiling metallibs for the iOS toolchain.
runtime_shaders = []
font-kit = ["dep:font-kit"]

[target.'cfg(target_os = "ios")'.dependencies]
gpui.workspace = true
# VoiceOver. Deliberately not paired with a direct `accesskit` row: the trait
# types come out of `gpui::accesskit`, so if a gpui bump ever moves off the
# accesskit this adapter wants, the handler impls below stop compiling instead
# of silently linking two copies of the tree types. 0.1.2 wants accesskit
# 0.24.1, which is exactly what the pinned gpui resolves.
accesskit_ios = "0.1.2"
# Same repo+rev as the [patch] pin for gpui, so cargo unifies the checkout.
# Bump these alongside the workspace [patch] rev or the lock carries two
# fork snapshots.
collections = { git = "https://github.com/demfabris/zed", rev = "71bcbb21d5c1a14cf126b49ae1c8408da317b4ed" }
gpui_util = { git = "https://github.com/demfabris/zed", rev = "71bcbb21d5c1a14cf126b49ae1c8408da317b4ed" }
anyhow = "1.0.86"
async-task = "4.7"
block = "0.1"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
dispatch2 = "0.3.1"
etagere = "0.2"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
futures = "0.3.32"
itertools = "0.14.0"
libc = "0.2"
log = "0.4.16"
mach2 = "0.5"
metal = "0.33"
objc = "0.2"
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
uuid = { version = "1.1.2", features = ["v4"] }

[build-dependencies]
# gpui is a build-dep only for GPUI_MANIFEST_DIR (cbindgen reads its sources
# to generate the shader header). The build script early-returns on non-iOS.
cbindgen = { version = "0.28.0", default-features = false }
gpui.workspace = true
