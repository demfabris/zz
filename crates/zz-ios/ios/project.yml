# The signing wrapper for physical iPads. `xcodegen generate --spec` turns
# this into ZZ.xcodeproj (generated, not committed): an app target with one
# stub source whose executable is replaced by the cargo-built `zz-ios`
# binary before Xcode signs the bundle. Simulator work never comes through
# here — `just ios` bundles unsigned via `cargo xtask ios-sim`.
name: ZZ
options:
  createIntermediateGroups: true
targets:
  ZZ:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - xcode-shim.c
    info:
      path: Info.gen.plist
      properties:
        CFBundleDisplayName: zz
        UIDeviceFamily: [1, 2]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: zz connects to your computers over SSH on the local network.
        # Mirrors Info.plist (the simulator bundle's), and must keep mirroring
        # it: the class name is resolved by the ObjC runtime, and the presence
        # of this key is what tells the app delegate to wait for the scene
        # instead of launching the legacy way.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: ZZGPUISceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zz.ios
        PRODUCT_NAME: ZZ
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y4JYPG9TS8
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - name: Embed the zz binary
        script: |
          set -euo pipefail
          if [ "${PLATFORM_NAME}" != "iphoneos" ]; then
            echo "error: this project only signs device builds - use 'just ios' for the simulator" >&2
            exit 1
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../../.."
          cargo build -p zz-ios --release --target aarch64-apple-ios
          cp "target/aarch64-apple-ios/release/zz-ios" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
