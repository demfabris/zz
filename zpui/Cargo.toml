[workspace]
resolver = "2"
members = [
    "crates/collections",
    "crates/zpui",
    "crates/zpui_apple",
    "crates/zpui_ios",
    "crates/zpui_linux",
    "crates/zpui_macos",
    "crates/zpui_macros",
    "crates/zpui_platform",
    "crates/zpui_shared_string",
    "crates/zpui_util",
    "crates/zpui_web",
    "crates/zpui_wgpu",
    "crates/zpui_windows",
    "crates/http_client",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/util_macros",
    "crates/zlog",
    "crates/ztracing",
    "crates/ztracing_macro",
    "tooling/perf",
]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
