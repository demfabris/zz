[package]
name = "zz-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zz's widget kit on zpui: theme, primitives, and widgets, forked from gpui-component (see UPSTREAM.md)"
publish = false

[features]
default = []
# The code-editor widget stack, off unless an app asks for it.
editor = []
# Syntax highlighting for the markdown renderer and the code editor.
tree-sitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-language",
    "dep:tree-sitter-json",
    "dep:tree-sitter-md",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-tmux",
    "dep:tree-sitter-toml-ng",
]

[dependencies]
anyhow = "1"
async-channel.workspace = true
image.workspace = true
log.workspace = true
# Markdown parsing: only the AST is used; `text` owns the rendering and
# re-exports `mdast` as `markdown_ast`.
markdown = { version = "1.0", features = ["serde"] }
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
# `include-exclude` is required by the `#[include]` attribute in `icon/assets.rs`.
rust-embed = { version = "8.12", features = ["include-exclude"] }
serde.workspace = true
smallvec.workspace = true
sum_tree.workspace = true
tree-sitter = { version = "0.27.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-language = { version = "0.1.8", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-tmux = { version = "0.1.4", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
# Grapheme-cluster boundaries, so editing steps over an emoji or a combining
# sequence as one unit.
unicode-segmentation = "1.13.3"
# Monotonic clock that works on native and under WASM.
web-time.workspace = true
zpui.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# Browsers have no filesystem for the debug-build disk reads, so the icon set
# is embedded in every wasm profile.
rust-embed = { version = "8.12", features = ["include-exclude", "debug-embed"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
url.workspace = true

[dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
