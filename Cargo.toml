[workspace]
members = [
    "crates/zz",
    "crates/zz-browser",
    "crates/zz-chrome-import",
    "crates/zz-cli",
    "crates/zz-client",
    "crates/zz-config",
    "crates/zz-gpui-ios",
    "crates/zz-hotreload",
    "crates/zz-kit",
    "crates/zz-client-ffi",
    "crates/zz-daemon",
    "crates/zz-mux",
    "crates/zz-protocol",
    "crates/zz-terminal",
    "crates/zz-tui",
    "crates/zz-ui",
    "crates/zz-web",
    "crates/zz-xtask",
]
exclude = [
    "clients/web",
    "zpui",
    "third_party/rust/libghostty-vt",
    "third_party/rust/libghostty-vt-sys",
]
resolver = "3"

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/demfabris/zz"
rust-version = "1.97"

[workspace.dependencies]
agent-client-protocol = "2.1.0"
aes = "=0.9.3"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
async-channel = "2.5.0"
async-signal = "0.2.14"
base64 = "0.23.1"
block2 = "0.6.2"
cargo_metadata = "0.23.1"
cbc = "=0.2.1"
cef = { version = "=154.0.0", features = ["accelerated_osr"] }
chrono = { version = "0.4.45", default-features = false }
core-foundation = "=0.10.1"
core-video = "=0.5.2"
crossbeam-channel = "0.5.17"
csscolorparser = "=0.8.4"
filedescriptor = "0.8.3"
env_logger = "0.11.11"
foldhash = "0.2.0"
futures-lite = "2.6.1"
zpui = { path = "zpui/crates/zpui" }
zpui_platform = { path = "zpui/crates/zpui_platform", default-features = false, features = ["font-kit", "wayland", "x11"] }
zpui_wgpu = { path = "zpui/crates/zpui_wgpu" }
getrandom = "0.4.3"
ignore = "0.4.33"
image = { version = "=0.25.10", default-features = false }
libc = "0.2.189"
interprocess = "2.4.4"
libghostty-vt = { path = "third_party/rust/libghostty-vt", default-features = false }
log = "0.4.34"
memchr = "2.8.3"
merman = { version = "=0.6.2", features = ["render"] }
mimalloc = "0.1.52"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSView", "NSWindow"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-io-surface = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }
oo7 = { version = "=0.6.0", default-features = false }
parking_lot = "0.12.5"
pbkdf2 = "=0.13.0"
plist = "1.10.1"
pollster = "1.0.1"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
raw-window-handle = "0.6.2"
regex = "1.13.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "pipe", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
security-framework = "=3.7.0"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
smallvec = { version = "=1.16.1", features = ["serde"] }
smol = "=2.0.2"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
url = "=2.5.8"
wayland-client = "0.31.15"
wgpu = "=30.0.1"
naga = { version = "=30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
windows = "=0.62.2"
x11rb = "0.13.2"
zeroize = "=1.9.0"

[patch.crates-io]
cef-dll-sys = { path = "third_party/rust/cef-dll-sys" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
result_large_err = "allow"
# Pixel math casts between f32/u32/i32 on every screen, and exact f32
# equality is the UI's change-detection idiom; clippy 1.97 warns on both.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
type_complexity = "allow"
# zpui idioms: `_subscriptions`/`_task` fields held for RAII get reassigned,
# and view methods take &self for organization before they need it.
used_underscore_binding = "allow"
unused_self = "allow"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.zpui]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.hotreload]
inherits = "dev"
debug = 0
strip = "none"

[profile.hotreload.package.fff-search]
opt-level = 0

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
split-debuginfo = "packed"

[profile.testflight]
inherits = "release"
debug = "line-tables-only"
strip = "none"
split-debuginfo = "packed"
