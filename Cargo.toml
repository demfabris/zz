[workspace]
members = [
    "crates/zz",
    "crates/zz-browser",
    "crates/zz-chrome-import",
    "crates/zz-client",
    "crates/zz-client-ffi",
    "crates/zz-daemon",
    "crates/zz-gpui-ios",
    "crates/zz-ios",
    "crates/zz-mux",
    "crates/zz-protocol",
    "crates/zz-terminal",
    "crates/zz-tui",
    "crates/zz-ui",
    "crates/zz-xtask",
]
exclude = [
    "examples/ui-showcase",
    "third_party/rust/libghostty-vt-sys",
    "third_party/rust/proc-macro-error2",
]
resolver = "3"

[workspace.package]
version = "0.2.0-beta.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/demfabris/zz"
rust-version = "1.97"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
aes = "=0.8.4"
aes-gcm = "=0.10.3"
async-channel = "2.5.0"
async-signal = "0.2.14"
base64 = "0.22.1"
block2 = "0.6.2"
cargo_metadata = "0.23.1"
cbc = "=0.1.2"
cef = { version = "=151.2.0", features = ["accelerated_osr"] }
chrono = "0.4.45"
core-foundation = "=0.10.1"
core-video = "=0.5.2"
crossbeam-channel = "0.5.16"
csscolorparser = "=0.8.3"
filedescriptor = "0.8.3"
env_logger = "0.11.11"
foldhash = "0.2.0"
futures-lite = "2.6.1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["font-kit", "wayland", "x11"] }
getrandom = "0.4.3"
image = "=0.25.10"
interprocess = "2.4.3"
libghostty-vt = { version = "=0.2.1", git = "https://github.com/uzaaft/libghostty-rs", rev = "46a9d2ac941ed600cf43c5e6299c8dfd1d3a1ef0", default-features = false }
log = "0.4.33"
merman = { version = "=0.6.2", features = ["render"] }
mimalloc = "0.1.52"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSView", "NSWindow"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-io-surface = "0.3.2"
objc2-metal = "0.3.2"
oo7 = { version = "=0.6.0", default-features = false }
parking_lot = "0.12.5"
pbkdf2 = "=0.12.2"
plist = "1.10.0"
pollster = "0.4.0"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
raw-window-handle = "0.6.2"
regex = "1.13.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "pipe", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
security-framework = "=3.7.0"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
smallvec = { version = "=1.15.2", features = ["serde"] }
smol = "=2.0.2"
sysinfo = "=0.31.4"
tempfile = "3.27.0"
thiserror = "2.0.20"
url = "=2.5.8"
wayland-client = "0.31.15"
wgpu = "=30.0.0"
windows = "=0.62.2"
x11rb = "0.13.1"
zeroize = "=1.9.0"

[patch.crates-io]
proc-macro-error2 = { path = "third_party/rust/proc-macro-error2" }

[patch."https://github.com/uzaaft/libghostty-rs"]
libghostty-vt-sys = { path = "third_party/rust/libghostty-vt-sys" }

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/demfabris/zed", rev = "71bcbb21d5c1a14cf126b49ae1c8408da317b4ed", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/demfabris/zed", rev = "71bcbb21d5c1a14cf126b49ae1c8408da317b4ed" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
result_large_err = "allow"
# Pixel math casts between f32/u32/i32 on every screen, and exact f32
# equality is the UI's change-detection idiom; clippy 1.97 warns on both.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
type_complexity = "allow"
# gpui idioms: `_subscriptions`/`_task` fields held for RAII get reassigned,
# and view methods take &self for organization before they need it.
used_underscore_binding = "allow"
unused_self = "allow"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.gpui]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
split-debuginfo = "packed"
