[package]
name = "zpui_macros"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Macros used by zpui"

[lints]
workspace = true

[features]
inspector = []

[lib]
path = "src/zpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
zpui = { workspace = true, features = ["inspector"] }
