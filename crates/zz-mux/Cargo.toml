[package]
name = "zz-mux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tmux-compatible multiplexer model: sessions, windows, panes, key tables"
publish = false

[dependencies]
chrono = { workspace = true, features = ["alloc", "std"] }
foldhash.workspace = true
glob = "0.3"
parking_lot.workspace = true
regex.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
zz-protocol.workspace = true
zz-terminal.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { version = "0.31.3", features = ["user"] }

[target.'cfg(not(unix))'.dependencies]
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
