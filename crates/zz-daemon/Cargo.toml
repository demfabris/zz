[package]
name = "zz-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The zz daemon: session state, PTY workers, client connections"
publish = false

[features]
default = ["agent"]
agent = [
    "dep:agent-client-protocol",
    "dep:async-channel",
    "dep:base64",
    "dep:futures-lite",
    "dep:smol",
]

[dependencies]
agent-client-protocol = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, features = ["alloc", "std"] }
futures-lite = { workspace = true, optional = true }
getrandom.workspace = true
glob = "0.3"
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
smol = { workspace = true, optional = true }
crossbeam-channel.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
regex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zz-daemon-client.workspace = true
zz-mux.workspace = true
zz-protocol.workspace = true
zz-terminal = { workspace = true, features = ["session"] }

[target.'cfg(unix)'.dependencies]
mio = { version = "1.2.3", features = ["os-poll", "os-ext"] }
signal-hook = { version = "0.4.4", default-features = false }
rustix = { workspace = true, features = ["fs", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
chrono = { workspace = true, features = ["clock"] }

[lints]
workspace = true
