[package]
name = "zz-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The zz iPad app: entry point, bundle assets, and mobile composition"

[[bin]]
name = "zz-ios"

[dependencies]
gpui.workspace = true
log.workspace = true
zz = { path = "../zz", default-features = false }
zz-gpui-ios = { path = "../zz-gpui-ios" }
zz-protocol = { path = "../zz-protocol" }
zz-ui = { path = "../zz-ui", features = ["editor", "tree-sitter"] }
