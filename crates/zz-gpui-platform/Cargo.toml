[package]
name = "zz-gpui-platform"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
style = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/zz_gpui_platform.rs"
doctest = false

[features]
default = []
bench-support = ["zz-gpui/bench-support"]
font-kit = ["dep:font-kit"]
inspector = ["zz-gpui/inspector"]
test-support = ["zz-gpui/test-support"]
runtime_shaders = []
multithreaded = ["dep:wasm_thread", "zz-gpui/wasm-threads"]
wayland = [
    "bitflags",
    "ashpd/wayland",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon/wayland",
    "open",
    "zz-gpui/wayland",
    "font-kit",
]
x11 = [
    "ashpd",
    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon/x11",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    "font-kit",
]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[dependencies]
anyhow.workspace = true
zz-gpui.workspace = true

