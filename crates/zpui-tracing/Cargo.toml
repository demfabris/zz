[package]
name = "zpui-tracing"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
style = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
name = "ztracing"
doctest = false

[features]
web = ["dep:async-channel", "dep:js-sys", "dep:tracing-subscriber", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
zlog.workspace = true
tracing.workspace = true

ztracing_macro.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3.22", optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", features = ["console", "Performance"], optional = true }
