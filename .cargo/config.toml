[alias]
xtask = "run -p zz-xtask --"
ci-test = "test --workspace --all-features --exclude zpui-apple --exclude zpui-linux --exclude zpui-macos --exclude zpui-platform --exclude zpui-web --exclude zpui-wgpu --exclude zpui-windows"

# The Windows link is static-CRT throughout: CEF's wrapper is built with
# CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded and zig emits static-CRT objects
# for libghostty-vt, so the Rust side matches (mixing models is LNK2038) —
# and the bundle sheds the VC redistributable. Linux and macOS are untouched.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
