GRAMMAR_BASE=grammar
GRAMMAR_BARE=$GRAMMAR_BASE-bare
GRAMMAR_BRACED=${GRAMMAR_BASE}-braced
GRAMMAR_ORDER=first
set-environment -g GRAMMAR_ORDER command
GRAMMAR_ORDER=last
GRAMMAR_SEED=seeded
GRAMMAR_SAME=$GRAMMAR_SEED set-environment -g GRAMMAR_SAMESTMT "[$GRAMMAR_SAME]"
%hidden GRAMMAR_HIDDEN=hidden-value
%if "#{==:x,x}"
GRAMMAR_TRUE=true-branch
%else
GRAMMAR_TRUE=wrong-branch
%endif
%if "#{==:x,y}"
GRAMMAR_ELIF=wrong-if
%elif "#{==:y,y}"
GRAMMAR_ELIF=elif-branch
%else
GRAMMAR_ELIF=wrong-else
%endif
%if "0"
GRAMMAR_FALSE=wrong-branch
%else
GRAMMAR_FALSE=false-branch
%endif
set-option -g @grammar-escape "\e[31m\s\u03bb\U0001F980"
rename-window -t w:0 "$GRAMMAR_BASE-${GRAMMAR_BASE}"
set-environment -g GRAMMAR_BEFORE_ERROR preserved
set-environment -g GRAMMAR_AFTER_ERROR preserved
run-shell "path=\"$HOME/zz-config-grammar-error.conf\"; printf '%s\\n' 'GRAMMAR_PARSE_ASSIGN=preserved' 'set @bad \\400' 'set-environment -g GRAMMAR_BEFORE_ERROR wrong' 'set-environment -g GRAMMAR_AFTER_ERROR wrong' > \"\$path\"; tmux -C source-file \"\$path\" | sed \"s|\$path|/tmp/zz-config-grammar-error.conf|g\" | grep '^%config-error' || true; rm -f \"\$path\""
