[package]
name = "zz-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The zz daemon: session state, PTY workers, client connections"
publish = false

[features]
default = ["daemon", "agent"]
agent = [
    "daemon",
    "dep:agent-client-protocol",
    "dep:async-channel",
    "dep:base64",
    "dep:futures-lite",
    "dep:serde",
    "dep:serde_json",
    "dep:smol",
]
daemon = [
    "dep:async-channel",
    "dep:async-signal",
    "dep:chrono",
    "dep:crossbeam-channel",
    "dep:futures-lite",
    "dep:smallvec",
    "dep:zz-mux",
    "zz-terminal/session",
]

[dependencies]
agent-client-protocol = { workspace = true, optional = true }
# The agent host runs its pane threads on every platform, so its executor and
# channel are not part of the unix-only signal plumbing below.
async-channel = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
getrandom.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
interprocess.workspace = true
log.workspace = true
parking_lot.workspace = true
smallvec = { workspace = true, optional = true }
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zeroize.workspace = true
zz-mux = { path = "../zz-mux", optional = true }
zz-protocol = { path = "../zz-protocol" }
zz-terminal = { path = "../zz-terminal", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
russh = { version = "0.54", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
rand_core = { version = "0.6", features = ["getrandom"] }
core-foundation.workspace = true
security-framework-sys = "2.17"

[target.'cfg(unix)'.dependencies]
async-signal = { workspace = true, optional = true }
rustix.workspace = true

[lints]
workspace = true
