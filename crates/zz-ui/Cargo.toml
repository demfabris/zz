[package]
name = "zz-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zz's application UI on zz-kit: panes, terminal, agent, palette, settings, navigation"
publish = false

[features]
default = []
agent = []
editor = ["zz-kit/editor"]
tree-sitter = ["zz-kit/tree-sitter"]

[dependencies]
image = { version = "=0.25.10", default-features = false }
log.workspace = true
markdown = { version = "1.0", features = ["serde"] }
merman.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
smallvec.workspace = true
web-time = "1.1.0"
zpui.workspace = true
zz-client = { path = "../zz-client" }
zz-kit = { path = "../zz-kit" }
zz-protocol = { path = "../zz-protocol" }
zz-terminal = { path = "../zz-terminal", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
url.workspace = true

[dev-dependencies]
zpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
